<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Pigeon 工作原理</title>
  <desc id="arch-desc">架构图:电脑端 Pigeon App 内嵌 axum HTTP 服务,手机浏览器通过局域网访问 /s/{token}/ 页面,经流式上传、下载与 SSE 实时刷新完成双向传输。</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="archBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7cff"/>
      <stop offset="1" stop-color="#2f5de0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7cff"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#archBg)"/>

  <!-- ===== 电脑端大卡 ===== -->
  <g transform="translate(64 84)">
    <rect width="400" height="216" rx="16" fill="#18213a" stroke="#2c3a5c"/>
    <text x="24" y="36" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#f2f6ff">电脑 · Pigeon App</text>
    <text x="24" y="58" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#63719a">Tauri 2 + Vue 3 桌面面板</text>

    <!-- 内嵌服务卡 -->
    <rect x="24" y="76" width="352" height="118" rx="12" fill="#10192e" stroke="#2c3a5c"/>
    <circle cx="46" cy="98" r="5" fill="#35c287"/>
    <text x="60" y="103" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#dbe4f5">axum HTTP 服务(Rust)</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#7ea4ff">
      <text x="46" y="130">/api/upload   流式 multipart 上传</text>
      <text x="46" y="152">/file/{name}  HTTP Range 断点续传</text>
      <text x="46" y="174">/api/events   SSE 实时推送</text>
    </g>
    <text x="24" y="212" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#63719a">共享目录 ~/Pigeon/Inbox · 手机页内嵌于二进制</text>
  </g>

  <!-- ===== 手机端大卡 ===== -->
  <g transform="translate(736 84)">
    <rect width="400" height="216" rx="16" fill="#18213a" stroke="#2c3a5c"/>
    <text x="24" y="36" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#f2f6ff">手机 · 浏览器</text>
    <text x="24" y="58" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#63719a">无需安装,扫码打开 /s/{token}/</text>

    <g font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#dbe4f5">
      <rect x="24" y="76" width="168" height="44" rx="10" fill="#10192e" stroke="#2c3a5c"/>
      <text x="108" y="103" text-anchor="middle">选文件 / 拍照上传</text>
      <rect x="208" y="76" width="168" height="44" rx="10" fill="#10192e" stroke="#2c3a5c"/>
      <text x="292" y="103" text-anchor="middle">文件夹打包 zip</text>
      <rect x="24" y="128" width="168" height="44" rx="10" fill="#10192e" stroke="#2c3a5c"/>
      <text x="108" y="155" text-anchor="middle">点击下载 / 直链分享</text>
      <rect x="208" y="128" width="168" height="44" rx="10" fill="#10192e" stroke="#2c3a5c"/>
      <text x="292" y="155" text-anchor="middle">文字 / 记录同步</text>
    </g>
    <text x="24" y="204" font-family="-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#8fa3c8">认证开启时需账号登录,权限可按账号分配</text>
  </g>

  <!-- ===== 中间:局域网传输通道 ===== -->
  <g>
    <path d="M478 152 H 722" stroke="#4a7cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M722 232 H 478" stroke="#4a7cff" stroke-width="2.5" marker-end="url(#arrow)" opacity=".75"/>
    <rect x="520" y="164" width="160" height="40" rx="20" fill="#1d2a4a"/>
    <text x="600" y="189" text-anchor="middle" font-family="-apple-system,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#7ea4ff">局域网 Wi-Fi</text>
    <text x="600" y="258" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#63719a">token 仅随 URL 携带</text>
  </g>

  <!-- ===== 底部:三步上手 ===== -->
  <g transform="translate(64 330)" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" fill="#dbe4f5">
    <text x="0" y="0">① 打开桌面 App</text>
    <text x="330" y="0">② 手机扫码</text>
    <text x="580" y="0">③ 互传文件、文字、截图</text>
    <path d="M150 -5 h 150" stroke="#4a7cff" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
    <path d="M420 -5 h 130" stroke="#4a7cff" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
  </g>
</svg>
